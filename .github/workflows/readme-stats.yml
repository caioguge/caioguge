name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Use um PAT (secret GH_STATS_TOKEN) para contar repositórios privados.
      # Sem ele, cai no GITHUB_TOKEN e mostra só dados públicos.
      TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # ---------- Dark mode ----------
      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide_border=true&theme=dark&bg_color=000000
          path: profile/top-langs-dark.svg
          token: ${{ env.TOKEN }}

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&line_height=28&hide_border=true&card_width=400&include_all_commits=true&theme=dark&bg_color=000000
          path: profile/stats-dark.svg
          token: ${{ env.TOKEN }}

      # ---------- Light mode ----------
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide_border=true&theme=default
          path: profile/top-langs-light.svg
          token: ${{ env.TOKEN }}

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&line_height=28&hide_border=true&card_width=400&include_all_commits=true&theme=default
          path: profile/stats-light.svg
          token: ${{ env.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || echo "Sem mudanças"
          git push
